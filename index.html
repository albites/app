<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albites Software</title>
<style>
  :root {
    --bg: #f6fafe;
    --card: #ffffff;
    --ink: #22354c;
    --sub: #7d8ca1;
    --accent: #3d7fc4;
    --accent-soft: #dcebfa;
    --line: #e3edf6;
  }
  * { box-sizing: border-box; }

  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.85;
    margin: 0;
    padding: 0 20px 140px;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 82% 4%, rgba(61, 127, 196, 0.10) 0%, transparent 42%),
      radial-gradient(circle at 6% 46%, rgba(61, 127, 196, 0.07) 0%, transparent 34%),
      linear-gradient(180deg, #ffffff 0%, var(--bg) 40%);
    background-attachment: fixed;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ---- ヘッダー ---- */
  header {
    padding: 84px 0 8px;
  }
  .profile {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
  }
  .avatar {
    display: block;
    width: 96px;
    height: 96px;
    border-radius: 24px;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 14px 30px -16px rgba(34, 53, 76, 0.5);
  }
  h1 {
    font-size: clamp(1.8em, 4vw, 2.35em);
    margin: 0 0 4px;
    color: var(--ink);
    letter-spacing: 0.01em;
    font-weight: 700;
  }
  .handle {
    color: var(--sub);
    font-size: 0.86em;
    margin: 0;
  }
  .handle a {
    color: var(--accent);
    text-decoration: none;
  }
  .handle a:hover { text-decoration: underline; }

  .intro {
    margin: 32px 0 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 4px 18px 18px 4px;
    padding: 24px 30px;
    color: #4b5e75;
    box-shadow: 0 14px 30px -26px rgba(34, 53, 76, 0.6);
  }
  .intro strong { color: var(--ink); }

  /* ---- セクション見出し ---- */
  .section-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 72px 0 26px;
  }
  .section-head h2 {
    font-size: 1.12em;
    color: var(--ink);
    margin: 0;
    white-space: nowrap;
    letter-spacing: 0.04em;
  }
  .section-head::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .chip {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.7em;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.12em;
    font-weight: 700;
  }

  /* ---- アプリカード ---- */
  .apps {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .apps a {
    display: flex;
    align-items: center;
    gap: 18px;
    height: 100%;
    padding: 22px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 14px 30px -26px rgba(34, 53, 76, 0.7);
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  }
  .apps a:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 22px 38px -26px rgba(61, 127, 196, 0.9);
  }
  .app-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    flex-shrink: 0;
    box-shadow: 0 8px 16px -10px rgba(34, 53, 76, 0.7);
  }
  .app-name {
    display: block;
    font-weight: 700;
    color: var(--ink);
    font-size: 1em;
  }
  .app-desc {
    display: block;
    font-size: 0.83em;
    color: var(--sub);
    line-height: 1.7;
    margin-top: 3px;
  }

  footer {
    color: var(--sub);
    font-size: 0.78em;
    margin-top: 84px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  /* ---- ペンギン ---- */
  .penguin {
    position: fixed;
    right: 28px;
    bottom: 0;
    width: 132px;
    pointer-events: none;
    z-index: 0;
    filter: drop-shadow(0 12px 18px rgba(34, 53, 76, 0.18));
  }
  @media (max-width: 760px) {
    .penguin { width: 88px; right: 12px; opacity: 0.85; }
  }
</style>
</head>
<body>

<svg class="penguin" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- 足 -->
  <ellipse cx="74" cy="226" rx="26" ry="11" fill="#f2a13c"/>
  <ellipse cx="126" cy="226" rx="26" ry="11" fill="#f2a13c"/>
  <!-- 体 -->
  <ellipse cx="100" cy="130" rx="70" ry="97" fill="#31435e"/>
  <!-- おなか -->
  <ellipse cx="100" cy="168" rx="51" ry="57" fill="#fbfdff"/>
  <!-- 翼 -->
  <ellipse cx="33" cy="146" rx="16" ry="47" fill="#27374f" transform="rotate(9 33 146)"/>
  <ellipse cx="167" cy="146" rx="16" ry="47" fill="#27374f" transform="rotate(-9 167 146)"/>
  <!-- 目 -->
  <circle cx="80" cy="88" r="13" fill="#ffffff"/>
  <circle cx="120" cy="88" r="13" fill="#ffffff"/>
  <circle cx="83" cy="90" r="6.5" fill="#1d2a3d"/>
  <circle cx="117" cy="90" r="6.5" fill="#1d2a3d"/>
  <!-- くちばし -->
  <path d="M100 104 L115 116 L100 127 L85 116 Z" fill="#f2a13c"/>
</svg>

<div class="wrap">
  <header>
    <div class="profile">
      <img class="avatar" src="https://github.com/kaleidot725.png" alt="Katz">
      <div>
        <h1>Albites Software</h1>
        <p class="handle">
          Developed by Katz ・
          <a href="https://github.com/albites">@albites</a> /
          <a href="https://github.com/kaleidot725">@kaleidot725</a>
        </p>
      </div>
    </div>

    <p class="intro">
      はじめまして、<strong>Katz</strong>です。普段はエンジニアとして働いています。<br>
      <strong>Albites Software</strong>という名義で、個人開発としてアプリを作っています。
    </p>
  </header>

  <div class="section-head">
    <h2>アプリ一覧</h2>
    <span class="chip">APPS</span>
  </div>

  <ul class="apps">
    <li>
      <a href="find-moon/">
        <img class="app-icon" src="find-moon/icon.png" alt="月探しのアイコン">
        <div>
          <span class="app-name">月探し (Find Moon)</span>
          <span class="app-desc">子供と月を探したい・今日はどんな月が見れるか、簡単にチェックできるアプリ</span>
        </div>
      </a>
    </li>
  </ul>

  <footer>© Albites Software</footer>
</div>

</body>
</html>
