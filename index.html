<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albites Software</title>
<style>
  :root {
    --bg: #fdf6e9;
    --card: #fffdf9;
    --ink: #4a3f35;
    --sub: #8b7b6a;
    --coral: #e8735a;
    --mustard: #e5aa3a;
    --teal: #4fa89b;
    --line: #e8dcc6;
  }
  * { box-sizing: border-box; }

  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.85;
    margin: 0;
    padding: 0 20px 120px;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(232, 115, 90, 0.10) 0 14px, transparent 14px),
      radial-gradient(circle at 88% 12%, rgba(79, 168, 155, 0.12) 0 20px, transparent 20px),
      radial-gradient(circle at 78% 62%, rgba(229, 170, 58, 0.12) 0 16px, transparent 16px),
      radial-gradient(circle at 8% 72%, rgba(229, 170, 58, 0.10) 0 22px, transparent 22px),
      radial-gradient(circle at 50% -12%, #fff8ec 0%, var(--bg) 60%);
    background-attachment: fixed;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
  }

  /* ---- ヘッダー ---- */
  header {
    padding: 76px 0 8px;
  }
  .profile {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
  }
  .avatar-frame {
    display: block;
    padding: 6px;
    background: var(--card);
    border: 3px solid var(--mustard);
    border-radius: 50%;
    box-shadow: 0 10px 26px -14px rgba(150, 110, 50, 0.6);
    transform: rotate(-3deg);
    flex-shrink: 0;
  }
  .avatar {
    display: block;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
  }
  h1 {
    font-size: clamp(1.8em, 4vw, 2.4em);
    margin: 0 0 4px;
    color: #6d4a1f;
    letter-spacing: 0.02em;
  }
  .handle {
    color: var(--sub);
    font-size: 0.88em;
    margin: 0;
  }
  .handle a {
    color: var(--sub);
    text-decoration: none;
    border-bottom: 1px dotted var(--sub);
  }

  .intro {
    margin: 30px 0 0;
    background: var(--card);
    border: 2px dashed var(--mustard);
    border-radius: 24px;
    padding: 26px 32px;
    color: #6b5842;
  }
  .intro strong { color: var(--coral); }

  /* ---- セクション見出し ---- */
  .section-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 68px 0 26px;
  }
  .section-head h2 {
    font-size: 1.25em;
    color: #6d4a1f;
    margin: 0;
    white-space: nowrap;
  }
  .section-head::after {
    content: "";
    flex: 1;
    height: 3px;
    border-radius: 3px;
    background: repeating-linear-gradient(
      90deg,
      var(--mustard) 0 14px,
      transparent 14px 26px
    );
  }
  .chip {
    background: var(--coral);
    color: #fff;
    font-size: 0.72em;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.05em;
  }

  /* ---- アプリカード ---- */
  .apps {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
  }
  .apps a {
    display: flex;
    align-items: center;
    gap: 18px;
    height: 100%;
    padding: 24px 26px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 22px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 12px 26px -20px rgba(150, 110, 50, 0.7);
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  }
  .apps a:hover {
    transform: translateY(-4px) rotate(-0.6deg);
    border-color: var(--mustard);
    box-shadow: 0 20px 34px -22px rgba(150, 110, 50, 0.85);
  }
  .app-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    flex-shrink: 0;
    box-shadow: 0 6px 14px -7px rgba(60, 40, 20, 0.5);
  }
  .app-name {
    display: block;
    font-weight: bold;
    color: #6d4a1f;
    font-size: 1.02em;
  }
  .app-desc {
    display: block;
    font-size: 0.84em;
    color: var(--sub);
    line-height: 1.65;
    margin-top: 3px;
  }

  footer {
    color: var(--sub);
    font-size: 0.8em;
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="profile">
      <span class="avatar-frame"><img class="avatar" src="https://github.com/kaleidot725.png" alt="Katz"></span>
      <div>
        <h1>Albites Software</h1>
        <p class="handle">
          Developed by Katz ・
          <a href="https://github.com/albites">@albites</a> /
          <a href="https://github.com/kaleidot725">@kaleidot725</a>
        </p>
      </div>
    </div>

    <p class="intro">
      はじめまして、<strong>Katz</strong>です。普段はエンジニアとして働いています。<br>
      <strong>Albites Software</strong>という名義で、個人開発としてアプリを作っています。
    </p>
  </header>

  <div class="section-head">
    <h2>アプリ一覧</h2>
    <span class="chip">APPS</span>
  </div>

  <ul class="apps">
    <li>
      <a href="find-moon/">
        <img class="app-icon" src="find-moon/icon.png" alt="月探しのアイコン">
        <div>
          <span class="app-name">月探し (Find Moon)</span>
          <span class="app-desc">子供と月を探したい・今日はどんな月が見れるか、簡単にチェックできるアプリ</span>
        </div>
      </a>
    </li>
  </ul>

  <footer>© Albites Software</footer>
</div>

</body>
</html>
