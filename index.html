<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albites Software</title>
<style>
  :root {
    --bg: #fbf3e7;
    --card: #fffdf8;
    --ink: #4a3f35;
    --sub: #8a7a68;
    --accent: #d98e46;
    --accent-soft: #f3d9b1;
    --line: #ecdfc9;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.9;
    margin: 0;
    padding: 56px 20px 96px;
    color: var(--ink);
    background: radial-gradient(circle at 50% -10%, #fff6e8 0%, var(--bg) 55%);
  }
  .sheet {
    max-width: 640px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 28px;
    padding: 48px clamp(24px, 6vw, 56px) 56px;
    box-shadow: 0 24px 60px -30px rgba(150, 110, 50, 0.35);
    border: 1px solid var(--line);
  }
  .avatar {
    display: block;
    width: 76px;
    height: 76px;
    margin: 0 auto 18px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent-soft);
  }
  h1 {
    font-size: 1.5em;
    text-align: center;
    margin: 0 0 4px;
    color: #7a5326;
  }
  .handle {
    text-align: center;
    color: var(--sub);
    font-size: 0.9em;
    margin-bottom: 1.6em;
  }
  .intro {
    text-align: center;
    color: #6b5842;
    background: #fdf5e6;
    border: 1px solid var(--accent-soft);
    border-radius: 16px;
    padding: 18px 22px;
    margin-bottom: 2.6em;
  }
  h2.section {
    font-size: 1.05em;
    color: #7a5326;
    margin-bottom: 1em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2.section::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  ul.apps {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul.apps li {
    margin-bottom: 14px;
  }
  ul.apps a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 22px;
    background: #fdf5e6;
    border: 1px solid var(--accent-soft);
    border-radius: 16px;
    text-decoration: none;
    color: #7a5326;
    font-weight: bold;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  ul.apps a:hover {
    background: var(--accent-soft);
    transform: translateY(-1px);
  }
  ul.apps img.app-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -4px rgba(150, 110, 50, 0.4);
  }
  ul.apps span.desc {
    display: block;
    font-weight: normal;
    color: var(--sub);
    font-size: 0.85em;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="sheet">
  <img class="avatar" src="https://github.com/kaleidot725.png" alt="Katz">
  <h1>Albites Software</h1>
  <p class="handle">Developed by Katz ・ GitHub: @albites / @kaleidot725</p>

  <p class="intro">
  はじめまして、Katzです。普段はエンジニアとして働いています。<br>
  Albites Softwareという名義で、個人開発としてアプリを作っています。
  </p>

  <h2 class="section">アプリ一覧</h2>
  <ul class="apps">
    <li>
      <a href="find-moon/">
        <img class="app-icon" src="find-moon/icon.png" alt="月探しのアイコン">
        <div>
          月探し (Find Moon)
          <span class="desc">子供と月を探したい・今日はどんな月が見れるか、簡単にチェックできるアプリ</span>
        </div>
      </a>
    </li>
  </ul>
</div>

</body>
</html>
